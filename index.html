  }else if(AI_ZIP_EXT.indexOf(ext)>=0){
    text=await aiZipText(f,ext);
  }else if(ext==="doc"||ext==="xls"||ext==="ppt"||ext==="rtf"||ext==="pages"||ext==="numbers"||ext==="key"){
    throw new Error("Files of this type can't be read yet. Please save it as .docx, .xlsx, .pptx or PDF and try again.");
  }else if(AI_TEXT_EXT.indexOf(ext)>=0||/^text\//.test(f.type)){
    text=await f.text();
    if(ext==="html"||ext==="htm")text=aiXmlDecode(text.replace(/<(script|style)[\s\S]*?<\/\1>/gi," ").replace(/<\/(p|div|li|tr|h[1-6])>/gi,"\n").replace(/<[^>]+>/g," "));
  }else{
    throw new Error("That file type isn't supported. You can use photos, PDF, Word, PowerPoint, Excel, OpenDocument and text files.");
  }
  text=text.replace(/\n{3,}/g,"\n\n").trim();
  if(!text)throw new Error("I couldn't find any readable text in that file.");
  if(text.length>AI_DOC_TEXT_MAX)text=text.slice(0,AI_DOC_TEXT_MAX)+"\n\n[The document was cut here because it is very long.]";
  return {url:aiTextToDataUrl(text)};
}
async function aiPhotoPick(inp){
  const f=inp.files&&inp.files[0];inp.value="";
  if(!f)return;
  if(f.type&&f.type.indexOf("image/")===0){
    try{AI_PENDING=await shrinkImg(f,1024);AI_PENDING_NAME="";}catch(_){alert("Could not read that image.");return;}
  }else{
    const t=document.getElementById("aiInput");if(t)t.placeholder="Reading document…";
    try{const d=await aiReadDocument(f);AI_PENDING=d.url;AI_PENDING_NAME=f.name||"Document";}
    catch(e){aiSyncSend();alert((e&&e.message)||"Could not read that document.");return;}
  }
  aiSyncSend();
  const box=document.getElementById("aiInput");if(box)box.focus();
}
function aiSendPhoto(q){
  const thumb=AI_PENDING,dname=AI_PENDING_NAME;AI_PENDING=null;AI_PENDING_NAME="";
  const box=document.getElementById("aiInput");if(box){box.value="";aiGrow(box);}
  aiSyncSend();
  const isDoc=thumb.indexOf("data:image")!==0;
  const u={role:"user",content:isDoc?("📄 "+(dname||"Document")+(q?"\n"+q:"")):(q||"Please explain this image.")};
  if(!isDoc)AI_THUMBS.set(u,thumb);
  const ask=isDoc?(q||"Please read this document and give me a clear summary with the key points."):u.content;
  aiRun(u,async()=>{
    const d=await aiPost("/image",{image:thumb,prompt:ask},90000);
    return{role:"assistant",content:(d.reply&&String(d.reply).trim())||(isDoc?"Sorry, I couldn't read that document.":"Sorry, I couldn't read that image.")};
  });
}
function aiIntent(t){
  t=(t||"").trim();if(t.length>400)return null;
  let m=t.match(/^(?:please\s+|pls\s+)?(?:(?:can|could|would|will)\s+you\s+)?(?:please\s+)?(?:generate|create|make|draw|paint|design|produce|render|sketch|show)\s+(?:me\s+|us\s+)?(?:an?\s+|the\s+|some\s+)?(?:[a-z-]+\s+){0,2}?(?:picture|image|photo|photograph|illustration|drawing|painting|sketch|artwork|diagram|logo|poster|wallpaper|cartoon)s?\b\s*(?:of|showing|about|for|with|depicting|that\s+shows)?\s*(.*)$/i);
  if(m)return (m[1]||"").trim()||t;
  m=t.match(/^(?:please\s+|pls\s+)?(?:(?:can|could|would|will)\s+you\s+)?(?:please\s+)?(?:draw|sketch|paint)\s+(?:me\s+|us\s+)?(.{2,})$/i);
  if(m)return m[1].trim();
  return null;
}
function aiGenerate(q,original){
  aiRun({role:"user",content:original||q},async()=>{
    const d=await aiPost("/generate",{prompt:q});
    if(!d.url)throw new Error("no picture returned");
    await new Promise((ok,no)=>{
      const i=new Image();const t=setTimeout(()=>no(new Error("picture took too long")),60000);
      i.onload=()=>{clearTimeout(t);ok();};
      i.onerror=()=>{clearTimeout(t);no(new Error("picture service busy, wait 15 seconds"));};
      i.src=d.url;
    });
    return{role:"assistant",content:"Here is your picture: "+q,img:d.url};
  });
}

/* the AI personalizes itself: it picks up the student's name and class from the chat */
function aiAutoLearn(text){
  try{
    const t=String(text||"");const pr=getProfile();let ch=false;
    const nm=t.match(/\b(?:my name is|my name's|call me|i am called|i'm called)\s+([A-Za-z][A-Za-z'-]{1,20})/i);
    if(nm&&nm[1]){const n=nm[1].charAt(0).toUpperCase()+nm[1].slice(1);if(n!==pr.name){pr.name=n;ch=true;}}
    let lv="",cl="";
    let m=t.match(/\b(?:form|f)\s*([1-4])\b/i);if(m){lv="Secondary";cl="Form "+m[1];}
    if(!cl){m=t.match(/\b(?:standard|std)\s*([1-8])\b/i);if(m){lv="Primary";cl="Standard "+m[1];}}
    let tert=false;
    if(!cl){m=t.match(/\b(?:i\s*(?:am|'m)\s+(?:a\s+)?(?:studying|student|doing|pursuing|taking)|i\s+study|i'm\s+studying|studying|my\s+(?:course|degree|programme|program|major)(?:\s+is)?|(?:degree|diploma|certificate|bsc|course|major)\s+in|majoring\s+in)\b([^.?!]{0,60})/i);if(m){const hit=tertCategory(m[1]||"");if(hit){lv="Tertiary";cl=hit;tert=true;}}}
    if(cl&&(tert||/\b(i am|i'm|im|i study|i'm in|i am in|my class|class)\b/i.test(t))&&cl!==pr.cls){pr.level=lv;pr.cls=cl;ch=true;}
    if(ch){saveProfile(pr);aiRefreshProfileUI();}
  }catch(_){}
}
async function aiSend(text){
  if(AI_BUSY) return;
  text = (text||"").trim();
  if(AI_REC){try{AI_REC.stop();}catch(_){}}
  if(AI_PENDING){ aiSendPhoto(text); return; }
  if(!text) return;
  const inp=document.getElementById("aiInput"); if(inp){inp.value="";aiGrow(inp);}
  aiAutoLearn(text);
  const gp=aiIntent(text); if(gp){aiGenerate(gp,text);return;}
  const turns=chatTurns, cid=curConvId;
  const endpoint = getAIEndpoint();
  if(!endpoint){
    turns.push({role:"user", content:text}); saveChatTurns();
    turns.push({role:"assistant", content: NOT_CONFIGURED_MSG});
    renderAIMessages(); finishAI(turns,cid); return;
  }
  aiRun({role:"user", content:text}, async()=>{
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),45000);
    if(AI_RUN) AI_RUN.ctrl=ctrl;
    try{
      const res = await fetch(endpoint, {
        method: "POST",
        signal: ctrl.signal,
        headers: eduDeviceHeaders(),
        body: JSON.stringify({ messages: turns.slice(-12), context: buildAppContext() })
      });
      let data=null; try{ data=await res.json(); }catch(_){}
      if(!res.ok) throw new Error("Server responded "+res.status+(data&&(data.error||data.message)?": "+(typeof (data.error||data.message)==="string"?(data.error||data.message):JSON.stringify(data.error||data.message)):""));
      const reply = data && (data.reply || data.text || data.message || data.content || (data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content) || (Array.isArray(data.content)&&data.content.map(x=>x.text||"").join("")));
      return {role:"assistant", content:(typeof reply==="string"&&reply.trim())?reply:"Sorry, I didn't get a response. Please try again."};
    } finally { clearTimeout(to); }
  });
}
function finishAI(turns,cid){
  const c=AI_CONVS.find(x=>x.id===cid); if(c) c.updated=Date.now();
  persistConvs();
  AI_BUSY=false; AI_RUN=null; aiSyncSend();
  if(chatTurns===turns) renderAIMessages();
  if(document.getElementById("aiHistList")) drawAIHist();
}

let CUR_HASH=location.hash,PREV_HASH="";
window.addEventListener("hashchange",()=>{PREV_HASH=CUR_HASH;CUR_HASH=location.hash;});
function aiBack(){ttsStop();if(PREV_HASH&&PREV_HASH!==location.hash)history.back();else location.hash="#/";}
let KB_BASE=0,KB_OPEN=false;
function aiKbState(){
  const vv=window.visualViewport,ih=window.innerHeight,vh=vv?vv.height:ih;
  KB_BASE=Math.max(KB_BASE,ih,vh);
  const inset=vv?Math.max(0,Math.round(ih-vv.height-vv.offsetTop)):0;
  const shrunk=KB_BASE-Math.min(ih,vh);
  return {open:(inset>120||shrunk>120),inset:inset>120?inset:0};
}
function aiFit(){
  const w=document.querySelector(".aiwrap");
  if(!w){document.body.classList.remove("kbopen");KB_OPEN=false;return;}
  const k=aiKbState();
  /* keyboard was closed with the phone's back button: drop the focus so the bar settles back down */
  if(KB_OPEN&&!k.open){const t=document.activeElement;if(t&&(t.id==="aiInput"))t.blur();}
  KB_OPEN=k.open;
  document.body.classList.toggle("kbopen",k.open);
  const h=document.getElementById("topHeader"),n=document.querySelector(".bottomnav");
  w.style.top=(h?Math.round(h.getBoundingClientRect().bottom):56)+"px";
  w.style.bottom=(k.open?k.inset:(n&&n.offsetHeight?n.offsetHeight:0))+"px";
  const sc=document.getElementById("aiScroll");if(sc)sc.scrollTop=sc.scrollHeight;
}
window.addEventListener("resize",aiFit);
window.addEventListener("orientationchange",()=>{KB_BASE=0;setTimeout(aiFit,300);});
if(window.visualViewport){visualViewport.addEventListener("resize",aiFit);visualViewport.addEventListener("scroll",aiFit);}
document.addEventListener("focusin",e=>{if(e.target&&e.target.id==="aiInput")setTimeout(aiFit,300);});
window.addEventListener("hashchange",()=>{document.body.classList.remove("kbopen");KB_OPEN=false;});
render();
window.addEventListener("hashchange", render);
</script>
<script>
/* ---------- Reading mode + Settings ---------- */
const APP_VERSION="1.0.6"; // <- change this when you release a new version
const APP_BUILD_NOTE="Mobile-friendly digital library for students in Malawi";
(function(){
  const EYE_SVG='<svg class="sic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',GEAR_SVG='<svg class="sic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
  const TINTS={orange:[255,138,38,"Orange"],amber:[255,192,72,"Amber"],sepia:[222,178,120,"Sepia"],rose:[255,150,160,"Rose"]};
  const ls=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
  const sv=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
  let on=ls("edu_rm_on")==="1",lvl=Math.min(100,Math.max(0,parseInt(ls("edu_rm_lvl")||"50",10)||0)),tint=TINTS[ls("edu_rm_tint")]?ls("edu_rm_tint"):"orange";
  const ov=document.createElement("div");ov.id="rmOverlay";document.body.appendChild(ov);
  const subs=[];
  function apply(){
    const t=TINTS[tint];
    ov.style.background="rgb("+t[0]+","+t[1]+","+t[2]+")";
    ov.style.opacity=on?(0.06+lvl/100*0.52).toFixed(3):"0";
    const b=document.getElementById("rmBtn");if(b){b.classList.toggle("on",on);b.setAttribute("aria-pressed",on?"true":"false");}
    subs.forEach(f=>f());
  }
  function setOn(v){on=!!v;sv("edu_rm_on",on?"1":"0");apply();}
  function setLvl(v){lvl=Math.min(100,Math.max(0,v|0));sv("edu_rm_lvl",String(lvl));apply();}
  function setTint(k){tint=k;sv("edu_rm_tint",k);apply();}
  function bind(root){
    const sw=root.querySelector(".rmsw"),sl=root.querySelector(".rmslider");
    const sync=()=>{if(!root.isConnected){const i=subs.indexOf(sync);if(i>=0)subs.splice(i,1);return;}
      sw.classList.toggle("on",on);sw.setAttribute("aria-checked",on?"true":"false");
      if(document.activeElement!==sl)sl.value=lvl;sl.style.setProperty("--v",lvl+"%");
      root.querySelectorAll(".rmswatches button").forEach(b=>b.classList.toggle("sel",b.dataset.t===tint));};
    sw.onclick=()=>setOn(!on);
    sl.oninput=()=>{if(!on)setOn(true);setLvl(+sl.value);};
    root.querySelectorAll(".rmswatches button").forEach(b=>b.onclick=()=>{if(!on)setOn(true);setTint(b.dataset.t);});
    subs.push(sync);sync();
  }
  function closePop(){const m=document.getElementById("rmPop");if(m)m.remove();}
  function openPanel(){
    closePop();
    const m=document.createElement("div");m.id="rmPop";m.className="rmpop";
    m.innerHTML=`<div class="rmcard" role="dialog" aria-label="Reading mode">
      <div class="rmrow"><b>Reading mode</b><button type="button" class="rmsw" role="switch" aria-label="Reading mode"></button></div>
      <p class="rmdesc">Reading mode makes the colours of your display warmer, allowing your eyes to relax.</p>
      <div class="rmhr"></div>
      <div class="rmadj">${EYE_SVG}<span>Adjust</span></div>
      <input class="rmslider" type="range" min="0" max="100" step="1" aria-label="Adjust reading mode colour">
      <button type="button" class="rmlink" id="rmMore">More colours in Settings</button></div>`;
    m.onclick=e=>{if(e.target===m)closePop();};
    document.body.appendChild(m);bind(m);
    m.querySelector("#rmMore").onclick=()=>{closePop();openSettings();};
  }
  function openSettings(){
    closePop();
    const o=document.createElement("div");o.className="aimodal";
    o.innerHTML=`<div class="card aiprof setcard" role="dialog" aria-label="Settings">
      <h3>${GEAR_SVG}<span>Settings</span></h3>
      <div class="setsec">Screen colour</div>
      <div class="setbox">
        <div class="rmrow"><b>Reading mode</b><button type="button" class="rmsw" role="switch" aria-label="Reading mode"></button></div>
        <p class="rmdesc">A warm tint that is easier on your eyes. Choose the colour you like and how strong it is.</p>
        <div class="rmswatches">${Object.keys(TINTS).map(k=>`<button type="button" data-t="${k}" style="background:rgb(${TINTS[k][0]},${TINTS[k][1]},${TINTS[k][2]})">${TINTS[k][3]}</button>`).join("")}</div>
        <div class="rmadj" style="margin-top:16px">${EYE_SVG}<span>Adjust</span></div>
        <input class="rmslider" type="range" min="0" max="100" step="1" aria-label="Adjust reading mode colour">
      </div>
      <div class="setsec">About</div>
      <div class="setbox">
        <div class="aboutrow"><span>App</span><b>Edu Library</b></div>
        <div class="aboutrow"><span>Version</span><b>${APP_VERSION}</b></div>
        <div class="aboutrow"><span>Made for</span><b>Students in Malawi</b></div>
        <p class="rmdesc" style="margin-top:10px">${APP_BUILD_NOTE}. Includes the Edu AI study assistant.</p>
      </div>
      <div class="setsec">Creator</div>
      <div class="setbox">
        <div class="aboutrow"><span>Name</span><b>Steven January (Billz)</b></div>
        <div class="aboutrow"><span>Role</span><b>Founder &amp; Lead Developer</b></div>
        <div class="aboutrow"><span>Expertise</span><b>Software &amp; Educational Technology</b></div>
        <div class="aboutrow"><span>Focus</span><b>Digital learning for Malawi</b></div>
        <p class="rmdesc" style="margin-top:10px">Steven January, known as Billz, is the founder and sole developer of Edu Library and the Edu AI study assistant. A Malawian self-taught software developer, he designed, programmed and launched the platform end to end, from a Python desktop prototype to the mobile-first web app students use today. His mission is to give every student in Malawi free, reliable access to books, exam papers and AI-powered study support on the device they already own.</p>
      </div>
      <button type="button" class="btn green" id="stDone" style="margin-top:16px">Done</button>
    </div>`;
    document.body.appendChild(o);
    const close=()=>o.remove();
    o.onclick=e=>{if(e.target===o)close();};
    o.querySelector("#stDone").onclick=close;
    bind(o);
  }
  function init(){
    const eb=document.getElementById("rmBtn"),sb=document.getElementById("stBtn");
    if(!eb||!sb){return setTimeout(init,50);}
    eb.onclick=()=>{
      if(document.getElementById("rmPop")){closePop();return;}
      if(!on)setOn(true);
      openPanel();
    };
    sb.onclick=openSettings;
    apply();
  }
  window.addEventListener("hashchange",closePop);

})();
