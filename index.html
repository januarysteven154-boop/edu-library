<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Edu Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E2338; --navy2:#16314A; --purple-deep:#241246;
    --ink:#14233A; --sub:#5B6B7C; --line:#E2E7ED;
    --bg:#F4F7FB; --card:#FFFFFF;
    --primary:#1F8A54; --primary-tint:#E6F4EC;
    --secondary:#1C6FA6; --secondary-tint:#E5F1F9;
    --tertiary:#6B3FA0; --tertiary-tint:#F0E9F8;
    font-family:'Inter',system-ui,sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:70px}
  h1,h2,h3{font-family:'Source Serif 4',serif;margin:0}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:520px;margin:0 auto;padding:0 18px}

  header.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px)}
  .topbar{display:flex;align-items:center;gap:10px;height:56px;max-width:520px;margin:0 auto;padding:0 18px}
  .topbar .back{background:none;border:none;color:#fff;font-size:18px;padding:0}
  .topbar h2{font-size:17px;color:#fff;flex:1}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px}
  .brand .mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;font-size:14px}

  .hero{background:radial-gradient(circle at 30% 0%,#2C1B5C,var(--navy) 60%);color:#fff;margin:0 -18px;padding:38px 18px 26px;text-align:center}
  .hero .cap{font-size:52px}
  .hero h1{font-size:26px;margin-top:6px}
  .hero p{color:#B9C3D6;font-size:13.5px;margin-top:4px}
  .search{margin-top:18px;display:flex;gap:8px}
  .search input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff;color:var(--ink)}
  .search input::placeholder{color:var(--sub)}
  .hero .search input{border:none}
  .search button{background:var(--secondary);color:#fff;border:none;border-radius:10px;padding:0 16px;font-size:13.5px;font-weight:600}

  .lvl-list{display:flex;flex-direction:column;gap:12px;padding:18px 0 30px}
  .lvl-row{display:flex;align-items:center;gap:14px;border-radius:14px;padding:16px 16px;color:#fff}
  .lvl-row .tag{width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
  .lvl-row .t{flex:1}
  .lvl-row .t b{display:block;font-size:15.5px}
  .lvl-row .t span{font-size:12.5px;opacity:.85}
  .lvl-row .arrow{font-size:17px}
  .lvl-row.Primary{background:linear-gradient(135deg,#1F8A54,#16A05C)}
  .lvl-row.Secondary{background:linear-gradient(135deg,#1C6FA6,#2C86C4)}
  .lvl-row.Tertiary{background:linear-gradient(135deg,#6B3FA0,#8A54C4)}

  .pagehead{padding:18px 0 6px}
  .pagehead h2{font-size:22px}
  .pagehead p{color:var(--sub);margin-top:3px;font-size:13.5px}
  .badgegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 0 30px}
  .badgecard{border-radius:14px;padding:18px 14px;text-align:center;border:1px solid var(--line);background:var(--card)}
  .badgecard .num{width:34px;height:34px;border-radius:50%;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
  .badgecard .lbl{font-weight:700;font-size:14px}
  .badgecard .cnt{color:var(--sub);font-size:11.5px;margin-top:2px}

  .banner{border-radius:16px;padding:26px 20px;color:#fff;margin:16px 0}
  .banner h2{font-size:20px}
  .banner p{font-size:13px;opacity:.9;margin-top:2px}
  .filters{display:flex;gap:7px;overflow-x:auto;padding:14px 0 4px}
  .filters button{flex:none;background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:12.5px}
  .filters button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .book{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
  .book .icon{width:38px;height:38px;border-radius:9px;background:var(--secondary-tint);color:var(--secondary);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
  .book .row{display:flex;gap:11px;align-items:center;flex:1;min-width:0}
  .book .meta b{font-size:14.5px}
  .book .meta div{color:var(--sub);font-size:12.5px;margin-top:2px}
  .book .open{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:600;white-space:nowrap}
  .empty{color:var(--sub);text-align:center;padding:50px 10px;font-size:14px}

  .loginwrap{background:var(--navy);margin:0 -18px;min-height:calc(100vh - 56px);display:flex;align-items:center;padding:20px 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;max-width:400px;margin:0 auto;width:100%}
  .card .shield{width:56px;height:56px;border-radius:50%;background:var(--secondary-tint);color:var(--secondary);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--navy)}
  .field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:9px;padding:12px 16px;font-size:14px;font-weight:700;width:100%}
  .btn.green{background:var(--primary)}
  .note{background:var(--primary-tint);color:var(--primary);border-radius:9px;padding:10px 13px;font-size:12.5px;margin:12px 0}
  .msg{font-size:12.5px;color:#B3261E;margin-top:8px}

  .adminhead{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
  .logout{background:#FCE8E6;color:#B3261E;border:none;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:700}
  .sidebar{display:flex;gap:7px;overflow-x:auto;padding-bottom:14px}
  .sidebar button{flex:none;background:var(--navy2);color:#fff;border:none;border-radius:9px;padding:9px 13px;font-size:12.5px}
  .sidebar button.active{background:var(--secondary)}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
  .stat{border-radius:13px;padding:18px;text-align:center;color:#fff}
  .stat b{display:block;font-size:23px}
  .stat span{font-size:11.5px;opacity:.9}
  .swatchrow{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;background:#fff}
  .swatchrow .dot{width:36px;height:36px;border-radius:50%;flex:none}
  .swatchrow .t{flex:1;font-weight:700;font-size:13.5px}
  .swatchrow select{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px}

  .aiwrap{display:flex;flex-direction:column;padding-top:14px}
  .aimsgs{display:flex;flex-direction:column;gap:10px;min-height:200px;padding-bottom:10px}
  .aigreet{background:var(--secondary-tint);color:var(--secondary);border-radius:12px;padding:13px 15px;font-size:13.5px}
.aibar{display:flex;align-items:flex-end;gap:6px;width:100%;box-sizing:border-box;margin:6px 0 4px}
.aipill{flex:1;min-width:0;display:flex;flex-direction:column;align-items:stretch;box-sizing:border-box;background:rgba(127,127,127,.14);border:1px solid var(--line);border-radius:24px;padding:4px 6px}
.aipill textarea{flex:1;min-width:0;width:100%;border:none!important;outline:none;background:transparent!important;color:var(--ink);font:inherit;font-size:15px;line-height:1.35;resize:none;padding:9px 4px 9px 6px;max-height:130px;overflow-y:auto;box-shadow:none}
.aipill textarea::placeholder{color:var(--sub)}
.aipillrow{display:flex;align-items:flex-end;gap:2px;min-width:0}
body .aibar .aipill textarea{background:transparent!important;border:none!important;border-radius:0!important}
.aibar .aiic{flex:none;width:38px;height:38px;padding:0!important;border-radius:50%!important;border:none;background:transparent!important;box-shadow:none!important;color:var(--sub)!important;display:flex;align-items:center;justify-content:center}
.aibar .aiic svg{width:23px;height:23px}
.aibar .aiic.plus{width:36px;height:36px;margin:1px 0;background:rgba(127,127,127,.22)!important;color:var(--ink)!important}
.aibar .aiic.plus svg{width:20px;height:20px}
.aibar .aisend{flex:none;width:48px;height:48px;padding:0!important;border-radius:50%!important;border:none;color:#fff!important;display:flex;align-items:center;justify-content:center;transition:transform .12s ease,box-shadow .2s ease;background:linear-gradient(135deg,#1E7CF2,#19d3ff)!important;box-shadow:0 0 0 1px rgba(25,211,255,.55),0 0 18px rgba(25,211,255,.5)!important}
.aibar .aisend svg{width:22px;height:22px;margin-left:2px}
.aibar .aisend.arrow svg{width:24px;height:24px;margin-left:0}
.aibar .aisend.arrow{box-shadow:0 0 0 1px rgba(25,211,255,.85),0 0 26px rgba(25,211,255,.75)!important}
.aibar .aisend.stop svg{width:20px;height:20px;margin-left:0}
.aibar .aisend:active{transform:scale(.94)}
.aibar .aiic.rec{color:#ff4d6d!important;animation:aimic 1.1s ease-in-out infinite}
@keyframes aimic{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.aibar .aiic.rec{animation:none}}
body.light .aibar .aisend,body.light .aibar .aisend.arrow{background:linear-gradient(135deg,#2A5BE8,#1E7CF2)!important;box-shadow:0 4px 12px rgba(30,124,242,.38)!important}
.aibar .aisend:disabled{opacity:.5}
  .aichip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(127,127,127,.14);color:var(--ink);border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:600;max-width:100%}
  .aimodal{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px}
  .aiprof{max-width:380px;width:100%}
  .aiprof h3{margin-bottom:4px}
  .aiprof .hint{color:var(--sub);font-size:12.5px;margin:0 0 14px;line-height:1.45}
  .aiprof .lnk{background:none;border:none;color:var(--sub);font-size:12.5px;width:100%;margin-top:10px;padding:6px}
  .aiimg{display:block;border-radius:12px;margin-bottom:6px;cursor:zoom-in;object-fit:cover}
  .aiimg.up{width:120px;height:120px}
  .aiimg.gen{width:100%;max-width:240px;height:auto}
  .aiprev{padding:10px 0 2px 8px}
  .aiprevbox{position:relative;width:76px;height:76px}
  .aiprevbox img{width:76px;height:76px;object-fit:cover;border-radius:14px;display:block;border:1px solid var(--line)}
  .aiprevdoc{display:flex;align-items:center;gap:8px;max-width:230px;height:52px;padding:0 14px 0 12px;border-radius:14px;border:1px solid var(--line);background:rgba(127,127,127,.12);font-size:13px;font-weight:600}
  .aiprevdoc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .aiprevx{position:absolute;top:-6px;right:-6px;width:24px;height:24px;padding:0;border-radius:50%;border:none;background:#0b1b3f;color:#fff;font-size:12px;line-height:24px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  body.light .aiprevx{background:#fff;color:#0b1b3f}
  .aizoom{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
  .aizoom img{max-width:100%;max-height:100%;border-radius:10px}
  .bubble{max-width:85%;padding:11px 14px;border-radius:13px;font-size:13.5px;line-height:1.45;white-space:pre-wrap;position:relative}
  .bubble.user{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
  .bubble.assistant{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;padding-right:38px}
  .speak-btn{position:absolute;top:8px;right:8px;background:none;border:none;font-size:15px;padding:2px;opacity:.55;line-height:1}
  .speak-btn:active{opacity:1}
  .aisuggest{display:flex;gap:7px;flex-wrap:wrap;padding:6px 0 14px}
  .aisuggest button{background:var(--tertiary-tint);color:var(--tertiary);border:none;border-radius:20px;padding:7px 13px;font-size:12px;font-weight:600}
  .clearchat{background:none;border:1px solid var(--line);border-radius:9px;padding:9px;font-size:12.5px;color:var(--sub);width:100%;margin-top:10px}
  .aifab{position:fixed;right:16px;bottom:84px;width:52px;height:52px;border-radius:50%;
    background:linear-gradient(135deg,var(--tertiary),var(--secondary));color:#fff;border:none;font-size:22px;
    box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:19;display:none}

  .bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
  .bottomnav a{flex:1;text-align:center;padding:9px 4px 8px;font-size:10.5px;color:var(--sub);font-weight:600}
  .bottomnav a .ic{font-size:19px;display:block;margin-bottom:2px}
  .bottomnav a.active{color:var(--navy)}

/* FIX: class cards must never overflow sideways */
.cgrid>.ct{min-width:0;max-width:100%;box-sizing:border-box}
.cgrid .cx{min-width:0;flex:1 1 auto;overflow-wrap:anywhere}
.cgrid .cx b{font-size:16px}
.cgrid .co{width:40px;height:40px;font-size:19px}
.cgrid:not(.Tertiary) .ct{gap:8px;padding:14px 10px}
.cgrid:not(.Tertiary) .ct>i{font-size:20px}
.lvlpg,.lvlpg .cgrid{max-width:100%;overflow-x:hidden}
.lvlpg .cgrid{padding-left:10px!important;padding-right:10px!important;margin:0!important}
/* AI message formatting */
.bubble{white-space:normal!important;overflow-wrap:anywhere}
.bubble p{margin:0 0 8px}.bubble p:last-of-type{margin-bottom:0}
.bubble h4{margin:8px 0 4px;font-size:14.5px}
.bubble ul,.bubble ol{margin:4px 0 8px;padding-left:20px}.bubble li{margin:2px 0}
.bubble code{background:rgba(127,127,127,.2);padding:1px 5px;border-radius:5px;font-size:12.5px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/appwrite@21.5.0"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#050816;--card:rgba(255,255,255,.05);--ink:#E6EEFF;--sub:#8EA2C8;--line:rgba(110,150,255,.22);--neon:#00E5FF;--neon2:#8B5CFF}
body{background:radial-gradient(circle at 12% -8%,#1b1055 0,transparent 45%),radial-gradient(circle at 100% 35%,#062f4a 0,transparent 40%),#050816;background-attachment:fixed;color:var(--ink)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(0,229,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.05) 1px,transparent 1px);background-size:36px 36px}
h1,h2,h3,.brand{font-family:'Orbitron',sans-serif;letter-spacing:.4px}
header,#topHeader{background:rgba(5,8,22,.78)!important;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hero{background:linear-gradient(160deg,rgba(100,60,255,.32),rgba(0,229,255,.1))!important;border:1px solid var(--line);border-radius:0 0 28px 28px}
.hero h1,.about h2{background:linear-gradient(90deg,var(--neon),var(--neon2));-webkit-background-clip:text;background-clip:text;color:transparent}
input,select,textarea,.filters button{background:rgba(255,255,255,.06)!important;color:var(--ink)!important;border-color:var(--line)!important}
option{color:#000}::placeholder{color:#7f92b8}
.field label,.pagehead h2{color:var(--ink)}
.book,.badgecard,.card,.swatchrow,.bubble.assistant{background:rgba(255,255,255,.05)!important;border:1px solid var(--line)!important;backdrop-filter:blur(10px)}
.badgecard:hover,.book:hover,.lvl-row:hover{box-shadow:0 0 20px rgba(0,229,255,.35);border-color:var(--neon)!important}
.lvl-row{box-shadow:0 0 22px rgba(0,229,255,.16);border:1px solid rgba(255,255,255,.15)}
.book{gap:12px}.book .meta{flex:1;min-width:0}
.book .open,.cta,.search button{background:linear-gradient(90deg,#00C2FF,#7A5CFF)!important;color:#fff!important;border:none;text-align:center;text-decoration:none;box-shadow:0 0 14px rgba(0,194,255,.4)}
.bottomnav{background:rgba(5,8,22,.88)!important;backdrop-filter:blur(16px);border-top:1px solid var(--line)!important}
.bottomnav a.active{color:var(--neon);text-shadow:0 0 10px var(--neon)}
.about{text-align:center;padding:22px 4px 6px}.about h2{font-size:19px}.about p{color:var(--sub);font-size:13.5px;line-height:1.55;margin:8px 0 0}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.feats div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:13px;backdrop-filter:blur(10px)}
.feats span{font-size:22px}.feats b{display:block;font-size:13px;margin:5px 0 3px}.feats p{margin:0;color:var(--sub);font-size:11.5px;line-height:1.45}
.cta{display:block;border-radius:14px;padding:15px;font-weight:700;font-size:15px;margin:6px 0 20px}
.thumb{width:62px;height:84px;flex:none;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover}
.acts{display:flex;flex-direction:column;gap:6px}
.book .acts .open.ib{display:flex;align-items:center;justify-content:center;width:44px;height:38px;padding:0;box-sizing:border-box;margin:0 auto}
.book .acts .open.ib svg,.pvbar .open svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pvbar a.open{display:inline-flex;align-items:center;justify-content:center}
#navX{touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.pv{position:fixed;inset:0;z-index:100;background:#050816;display:flex;flex-direction:column}
.pvbar{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.pvbar b{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvbar button{background:none;border:none;color:#fff;font-size:20px}
.pvbody{flex:1;overflow:auto;padding:8px;touch-action:pan-x pan-y;overscroll-behavior:contain}
.pvwrap{margin:0 auto}
.pvpage{position:relative;margin:0 auto 10px;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 0 22px rgba(0,229,255,.18)}
</style>
<style>
body{background:linear-gradient(180deg,#0a1a45,#060d24 55%,#050a1c);background-attachment:fixed}
body::before{display:none}
h1,h2,h3,.brand{font-family:'Inter',sans-serif;font-weight:800;letter-spacing:0}
.book .open,.cta,.search button{background:linear-gradient(90deg,#1E7CF2,#2A5BE8)!important;box-shadow:none}
.book,.badgecard,.card,.feats div{border-radius:16px!important;background:#0e1d47!important;backdrop-filter:none}
input,select,textarea,.filters button{background:#0e1d47!important;border-radius:12px!important}
.filters button.active{background:#1E7CF2!important;border-color:#1E7CF2!important}
.bottomnav{background:#08132e!important}.bottomnav a.active{color:#4DA3FF;text-shadow:0 0 12px #2b7fff}
.lvl-row{border-radius:16px;padding:18px;box-shadow:none;border:none}
.lvl-row.Primary{background:linear-gradient(90deg,#12A05C,#1DBA6D)}.lvl-row.Secondary{background:linear-gradient(90deg,#1E6FE8,#2E8BFF)}.lvl-row.Tertiary{background:linear-gradient(90deg,#5B35D8,#7C4DFF)}
.lvl-list{display:grid;gap:12px;padding-top:6px}
.lvl-list::after{content:"“Education is the key to a better future.”";text-align:center;color:#cfe0ff;font-weight:600;font-size:14px;padding:46px 20px;border-radius:16px;margin-top:6px;background:linear-gradient(180deg,rgba(30,124,242,.15),rgba(91,53,216,.25))}
.greet{padding:18px 0 12px}.greet h2{font-size:20px}.greet p{margin:3px 0 0;color:var(--sub);font-size:13px}
.welcome{border-radius:18px;padding:22px 18px;background:linear-gradient(135deg,#1e5bd8,#5b35d8 60%,#12a05c)}
.welcome small{opacity:.85;font-size:13px}.welcome h1{font-size:28px;margin:2px 0 6px}.welcome p{margin:0 0 14px;font-size:13px;opacity:.9}
.welcome a{display:inline-block;background:#1E7CF2;color:#fff;font-weight:700;font-size:13px;padding:9px 16px;border-radius:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.tile{border-radius:16px;padding:16px;color:#fff;min-height:118px}.tile span{font-size:26px}.tile b{display:block;font-size:16px;margin:6px 0 3px}.tile p{margin:0;font-size:11.5px;opacity:.9;line-height:1.4}
.tg{background:linear-gradient(135deg,#12A05C,#1DBA6D)}.tp{background:linear-gradient(135deg,#6B3FE0,#8B5CFF)}.to{background:linear-gradient(135deg,#F2711C,#FF9A3D)}.tb{background:linear-gradient(135deg,#1E6FE8,#2E8BFF)}
.sec{font-size:15px;margin:16px 0 10px}
.kfs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.kfs div{background:#0e1d47;border:1px solid var(--line);border-radius:14px;padding:14px 6px}.kfs span{font-size:24px}.kfs b{display:block;font-size:12px;margin:5px 0 2px}.kfs p{margin:0;font-size:10.5px;color:var(--sub)}
.avail{text-align:center;margin:16px 0;padding:11px;border-radius:12px;background:#0e1d47;border:1px solid var(--line);font-size:12.5px;color:var(--sub)}.avail b{color:#fff}
.sublist{display:grid;gap:9px;padding-top:8px}
.subrow{display:flex;align-items:center;gap:12px;background:#0e1d47;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-weight:600;font-size:14.5px}
.subrow span{width:34px;height:34px;border-radius:9px;background:rgba(30,124,242,.2);display:flex;align-items:center;justify-content:center;font-size:18px}
.subrow i{margin-left:auto;font-style:normal;font-size:12px;color:var(--sub)}.subrow em{font-style:normal;color:var(--sub);font-size:20px}
.pops button{background:#0e1d47;color:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:12.5px;margin:0 7px 8px 0}
</style>
<style>
.land{min-height:calc(100vh - 150px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 6px}
.orb{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:54px;background:radial-gradient(circle at 35% 30%,#4DA3FF,#5B35D8 65%,#1a1050);box-shadow:0 0 0 10px rgba(77,163,255,.1),0 0 60px rgba(91,53,216,.7);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 20px rgba(77,163,255,.05),0 0 90px rgba(77,163,255,.7)}}
.land h1{font-size:34px;margin:26px 0 6px;background:linear-gradient(90deg,#7fc0ff,#b79bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.land .tag{color:#9fb3da;font-size:14px;margin:0}
.land .desc{color:#cfe0ff;font-size:14.5px;line-height:1.65;max-width:340px;margin:22px 0 30px}
.go{background:linear-gradient(90deg,#1E7CF2,#7C4DFF);color:#fff;font-weight:700;font-size:16px;padding:15px 40px;border-radius:30px;box-shadow:0 0 26px rgba(77,130,255,.55)}
.picks{display:grid;gap:16px;padding-top:12px}
.pick{position:relative;border-radius:22px;padding:26px 22px;color:#fff;overflow:hidden}
.pick .pi{width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:30px}
.pick b{display:block;font-size:22px;margin:14px 0 4px}.pick p{margin:0;font-size:13.5px;opacity:.9}
.pick em{position:absolute;right:22px;top:50%;font-style:normal;font-size:26px}
.pl{background:linear-gradient(135deg,#12A05C,#1DBA6D)}.pa{background:linear-gradient(135deg,#5B35D8,#8B5CFF)}
</style>
<style>
i{font-style:normal}.wl i,.phero i,.brandline i{color:#19d3ff}
.brandline{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.sun{position:relative;height:250px;margin:0 -18px;border-radius:0 0 30px 30px;background:radial-gradient(circle at 70% 30%,#ffd27a,transparent 32%),linear-gradient(180deg,#f7a24a,#e0578a 38%,#3b3a9e 68%,#050a1c)}
.flagrib{position:absolute;left:0;right:0;bottom:30px;height:16px;transform:skewY(-3deg);background:linear-gradient(90deg,#000 0 33%,#CE1126 33% 66%,#339E35 66%);opacity:.9}
.logo{position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4DA3FF,#5B35D8 70%);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 0 40px rgba(77,163,255,.8)}
.wl{text-align:center;margin-top:52px}.wl small{font-size:20px;font-weight:600}.wl h1{font-size:44px;margin:0}
.wl .tg{color:#cfe0ff;letter-spacing:.14em;font-size:13px;margin:8px 0}.wl .ds{color:#e6eeff;font-size:14.5px;line-height:1.55;margin:6px 8px 18px}
.inside{border:1px solid var(--line);border-radius:20px;padding:14px;background:rgba(14,29,71,.6)}
.pill{display:inline-block;padding:8px 16px;border-radius:20px;border:1px solid #2a4fd0;background:#0f2a7a;font-weight:700;font-size:14px;margin-bottom:14px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}.fg div{display:grid;grid-template-columns:42px 1fr;column-gap:9px}
.fg span{grid-row:1/3;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px}
.fg b{font-size:12.5px}.fg p{margin:2px 0 0;font-size:10.5px;color:var(--sub);line-height:1.35}
.go2{display:block;text-align:center;width:80%;margin:22px auto 10px;padding:15px;border-radius:30px;font-weight:700;font-size:17px;color:#fff;background:linear-gradient(90deg,#1E7CF2,#19d3ff);box-shadow:0 0 28px rgba(25,211,255,.55)}
.mtm{text-align:center;letter-spacing:.25em;font-size:10px;color:#8ea2c8;margin-bottom:14px}
.phero{position:relative;margin:0 -18px;padding:24px 18px 22px;border-radius:0 0 26px 26px;background:radial-gradient(circle at 80% 10%,rgba(255,190,90,.35),transparent 40%),linear-gradient(180deg,#1b4fa8,#0a1a45)}
.phero h2{font-size:32px;margin:0}.phero h3{font-size:22px;margin:2px 0 8px}.phero p{margin:4px 0 0;font-size:14px;color:#dbe8ff;max-width:270px}
.fl{position:absolute;right:16px;top:16px;width:46px;height:30px;border-radius:4px;background:linear-gradient(180deg,#000 0 33%,#CE1126 33% 66%,#339E35 66%)}
.chooser h3{font-size:21px;margin:20px 0 4px}.sub{color:var(--sub);font-size:13px;margin:0 0 14px}
.lv{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;margin-bottom:14px;border:1px solid}
.pri{background:linear-gradient(90deg,#0b6b3d,#0f3d3a);border-color:#1dba6d}.sec{background:linear-gradient(90deg,#0e3fa8,#0d2a70);border-color:#2e8bff}.ter{background:linear-gradient(90deg,#4b2aa8,#2a1670);border-color:#8b5cff}
.orb2{width:56px;height:56px;flex:none;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:26px}
.lv b{display:block;font-size:19px}.lv em{font-style:normal;font-weight:600;font-size:13.5px;color:#5ee6a0}.sec em{color:#4db2ff}.ter em{color:#c39bff}.lv p{margin:4px 0 0;font-size:12.5px;opacity:.85}
.chev{margin-left:auto;width:34px;height:34px;border-radius:50%;background:#1E7CF2;display:flex;align-items:center;justify-content:center;font-size:22px}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-top:16px}.cgrid.Tertiary{grid-template-columns:minmax(0,1fr)}
.ct{position:relative;display:flex;align-items:center;gap:10px;border-radius:18px;padding:16px 12px;color:#fff;min-height:96px;border:1px solid rgba(255,255,255,.28);box-shadow:0 6px 20px rgba(0,0,0,.35),inset 0 0 18px rgba(255,255,255,.12)}
.co{width:46px;height:46px;flex:none;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
.cx b{display:block;font-size:17px}.cx p{margin:2px 0 0;font-size:11.5px;opacity:.92;line-height:1.35}.ct>i{margin-left:auto;font-size:24px}
.cgrid.Secondary .ct{flex-direction:column;align-items:flex-start;min-height:190px;padding:18px}.cgrid.Secondary .ct>i{position:absolute;right:14px;top:55%}
.sp{display:inline-block;margin-top:10px;padding:5px 10px;border:1px solid rgba(255,255,255,.5);border-radius:14px;font-size:12px}
#aiFab{width:auto!important;height:auto!important;border-radius:26px!important;padding:9px 16px!important;background:rgba(10,20,60,.9)!important;border:2px solid #6a5cff!important;box-shadow:0 0 18px rgba(106,92,255,.7)!important;font-size:0!important}
#aiFab::after{content:"✦ Ask me anything school related";display:block;width:150px;white-space:normal;font-size:12px;line-height:1.3;font-weight:600;color:#fff;text-align:left}
.bottomnav{border-radius:22px 22px 0 0}
</style>

.ph{position:relative;margin-left:auto;width:60%;aspect-ratio:var(--ar);background-size:100% 100%;background-repeat:no-repeat}
.ph::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#0a1a45 0,transparent 42%)}
.phw{position:relative;margin:0 -18px}.phw .ph{width:100%;border-radius:0 0 30px 30px}.phw .ph::after{background:linear-gradient(0deg,#050a1c 0,transparent 45%)}

.phero{padding:0!important;min-height:230px;background:linear-gradient(180deg,#123a8c,#0a1a45)!important}

.flag{position:absolute;z-index:2;left:var(--fx);top:var(--fy);width:var(--fw);height:var(--fh);display:flex;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}

.flag i{flex:1;background-image:var(--flagimg);background-size:1600% 100%;transform-origin:left center;animation:wave 1.7s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateY(-4%) skewY(-7deg);filter:brightness(1.2)}50%{transform:translateY(4%) skewY(7deg);filter:brightness(.8)}}
@keyframes glow{50%{box-shadow:0 0 28px rgba(25,211,255,.55)}}
.lv,.ct,.go2{animation:glow 3.2s ease-in-out infinite}

<style>#ctl{position:fixed;top:10px;right:8px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#ctl>button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(8,19,46,.72);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;flex-direction:column;line-height:1}
#ctl small{font-size:8px;font-weight:800;margin-top:-1px}
#lgSheet{width:190px;background:rgba(8,19,46,.96);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#lgSheet[hidden]{display:none}
#lgSheet h4{margin:4px 6px 8px;font-size:12px;color:#9fb3da}
#lgSheet button{display:block;width:100%;text-align:left;background:none;border:none;color:#fff;padding:9px 10px;border-radius:9px;font-size:14px}
#lgSheet button.on{background:#1E7CF2}#lgSheet button:disabled{opacity:.45}#lgSheet em{font-size:10px;font-style:normal;color:#ffcf6b;margin-left:6px}
#aiFab::after{content:var(--aiq)!important}
body.light{--card:#fff;--ink:#0b1b3f;--sub:#4c5f8a;--line:rgba(30,70,160,.22);color:#0b1b3f;background:linear-gradient(180deg,#f4f8ff,#dbe7ff)!important;background-attachment:fixed!important}
body.light header,body.light #topHeader{background:rgba(255,255,255,.88)!important}
body.light .topbar,body.light .brandline,body.light .topbar h2,body.light .chooser h3,body.light .hd,body.light .pagehead h2,body.light .pagehead p,body.light .greet h2,body.light .fg3 b,body.light .l2t small,body.light .l2t .ds,body.light .tl,body.light .subrow,body.light .pvbar b,body.light .pvbar button{color:#0b1b3f!important;text-shadow:none!important}
body.light .phero .brandline,body.light .phero h2,body.light .phero h3,body.light .phero p{color:#fff!important}
body.light .bottomnav{background:#fff!important;border-top:1px solid var(--line)!important}
body.light .bottomnav a{color:#4c5f8a}
body.light .bottomnav a.active{color:#1E7CF2;text-shadow:none}
body.light .book,body.light .badgecard,body.light .card,body.light .feats div,body.light .subrow,body.light .kfs div,body.light .avail,body.light .pops button,body.light .bubble.assistant,body.light .swatchrow,body.light .hcard .thumb{background:#fff!important;color:#0b1b3f;border-color:var(--line)!important}
body.light input,body.light select,body.light textarea,body.light .filters button{background:#fff!important;color:#0b1b3f!important;border-color:var(--line)!important}
body.light .l2 .inside{background:rgba(255,255,255,.8)}
body.light .l2t h1,body.light .l2t h1 i,body.light .mot,body.light .wl h1{text-shadow:none!important}
body.light .l2t h1 i,body.light .mot,body.light .phero h2 i{color:#0a8fb8}
body.light .phero h2 i{color:#19d3ff!important}
body.light .phw .ph::after{background:linear-gradient(0deg,#dbe7ff 0,rgba(219,231,255,.55) 28%,transparent 62%)!important}
body.light .sub,body.light .hcard span,body.light .subrow i,body.light .subrow em{color:#4c5f8a!important}
body.light .pv{background:#eef4ff}
</style>
<style>.cx b{font-size:15px;white-space:nowrap}</style>
<style>
/* class list: fixed hero, vertically scrollable classes */
.lvlpg{display:flex;flex-direction:column;height:calc(100vh - 132px);height:calc(100dvh - 132px - 2*env(safe-area-inset-top,0px) - 2*env(safe-area-inset-bottom,0px));min-height:340px}
.lvlpg .phero{flex:none}
.lvlpg .cgrid{flex:1 1 auto;min-height:0;align-content:start;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:16px 4px 26px;margin:0 -4px;scrollbar-width:none}
.lvlpg .cgrid::-webkit-scrollbar{display:none}
/* AI history drawer */
.topbar .hamb{background:none;border:none;color:#1E7CF2;font-size:25px;padding:0 4px;line-height:1;margin-left:-12px;margin-right:-2px}

<script>
const LEVELS = {
  Primary:   {label:"Primary School", classes:["Standard 1","Standard 2","Standard 3","Standard 4","Standard 5","Standard 6","Standard 7","Standard 8"], icon:"📘", color:"#1F8A54"},
  Secondary: {label:"Secondary School", classes:["Form 1","Form 2","Form 3","Form 4"], icon:"🎓", color:"#1C6FA6"},
  Tertiary:  {label:"Tertiary / College", classes:["Engineering","IT & Computing","Health Sciences","Education","Business & Management","Agriculture & Natural Resources","Sciences","Law","Humanities & Social Sciences","Architecture & Construction","Tourism & Hospitality","Media & Communication","Theology","Other Courses"], sub:"Engineering • IT • Health • Education & more", legacy:"Other Courses", icon:"🏫", color:"#6B3FA0"},
};
const TIER_SEP=" | ";
const TIERS=[
  {k:"Basic",icon:"🌱",d:"New to this field? Start here with the fundamentals."},
  {k:"Standard",icon:"📗",d:"You know the basics and want to go deeper."},
  {k:"Advanced",icon:"🚀",d:"For professionals and experts in this field."}
];
function clsOf(b){return String(b.class||"").split(TIER_SEP)[0];}
const IC_EYE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const IC_DL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>';
/* Bottom-right slot: shows Exams (paper icon). Two quick swipes to the right turn it into Admin, and again back to Exams. */
const NAV_MODES={
  exam:{href:"#/exams",r:"exams",label:"Exams",svg:'<svg class="nic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3h8l4 4v14h-12z"/><path d="M14.5 3v4h4"/><path d="M9.5 12h6M9.5 16h6"/></svg>'},
  admin:{href:"#/admin",r:"admin",label:"Admin",svg:'<svg class="nic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20c.7-3.700 3.900-5.800 7.500-5.800s6.800 2.100 7.500 5.800"/></svg>'}
};
function setNavMode(m){
  const a=document.getElementById("navX");if(!a)return;
  if(!NAV_MODES[m])m="exam";
  const c=NAV_MODES[m];
  a.setAttribute("href",c.href);a.dataset.r=c.r;a.dataset.mode=m;
  a.innerHTML='<span class="ic">'+c.svg+'</span>'+c.label;
  const first=(location.hash.replace(/^#\/?/,"").split("/")[0])||"/";
  a.classList.toggle("active",first===c.r);
  try{sessionStorage.setItem("edu_navmode",m);}catch(e){}
}
(function(){
  const a=document.getElementById("navX");if(!a)return;
  let saved="exam";try{saved=sessionStorage.getItem("edu_navmode")||"exam";}catch(e){}
  setNavMode(saved);
  let sx=0,sy=0,st=0,down=false,last=0,block=0;
  a.addEventListener("pointerdown",e=>{down=true;sx=e.clientX;sy=e.clientY;st=Date.now();try{a.setPointerCapture(e.pointerId);}catch(_){}});
  a.addEventListener("pointerup",e=>{
    if(!down)return;down=false;
    const dx=e.clientX-sx,dy=e.clientY-sy,now=Date.now();
    if(dx>=40&&Math.abs(dy)<Math.max(30,dx*0.6)&&now-st<700){
      block=now+500;
      if(now-last<1600){
        last=0;
        setNavMode(a.dataset.mode==="admin"?"exam":"admin");
        try{if(navigator.vibrate)navigator.vibrate(25);}catch(_){}
      }else last=now;
    }
  });
  a.addEventListener("pointercancel",()=>{down=false;});
  a.addEventListener("click",e=>{if(Date.now()<block){e.preventDefault();e.stopPropagation();}},true);
})();
function isExam(b){return tierOf(b)==="Exam";}
function tierOf(b){return String(b.class||"").split(TIER_SEP)[1]||"";}
/* Only these classes have a national exam body: Standard 8 -> MANEB, Form 2 -> JCE, Form 4 -> MSCE (Form 2 / Form 4 let the admin pick JCE or MSCE). All other classes just have exams per subject. */
const EXAM_BODIES={"Standard 8":["MANEB"],"Form 2":["JCE","MSCE"],"Form 4":["JCE","MSCE"]};
function examBody(b){return String(b.class||"").split(TIER_SEP)[2]||"";}
function inTier(b,t){return !t||t==="*"||tierOf(b)===t;}
function inCls(b,level,c){
  if(b.level!==level) return false;
  const bc=clsOf(b);
  if(bc===c) return true;
  const L=LEVELS[level];
  return !!(L&&L.legacy===c&&!L.classes.includes(bc));
}
const BADGE_COLORS = ["#E85D8A","#F2994A","#E0B32B","#2FA36B","#3B8FD4","#8A54C4","#E0724F","#4C5FD4"];
/* Owner login now uses Supabase Auth. No username or password is stored in this file. */

/* ---------------- SUPABASE (shared storage + catalog) ---------------- */
/* Book servers. To add another one, fill in the url + key of the new project (Server B is ready and waiting).
   These links live only in this file, they cannot be changed from the Admin screen. */
const SERVERS=[
  {id:"A",name:"Server A",url:"https://uozxdopexjbxjpatodpl.supabase.co",key:"sb_publishable_7WBlnIk-CDi-nSiUT9JDBg_7iRT8j-V"},
  {id:"B",name:"Server B",type:"appwrite",endpoint:"https://fra.cloud.appwrite.io/v1",project:"6abc042e003c999d9977",db:"6abc081a001aa74f7a4c",table:"6abc0877003260119342",bucket:"6abc129c000afccadc97"},
  /* Examination servers (exam PDFs only). Fill in endpoint / project / db / table / bucket of each new Appwrite project to switch it on. */
  {id:"C",name:"Server C",exam:true,type:"appwrite",endpoint:"",project:"",db:"",table:"",bucket:""},
  {id:"D",name:"Server D",exam:true,type:"appwrite",endpoint:"",project:"",db:"",table:"",bucket:""}
];
SERVERS.forEach(x=>{
  if(x.type==="appwrite"){
    x.ok=false;
    try{
      if(window.Appwrite&&x.endpoint&&x.project&&x.db&&x.table&&x.bucket){
        const c=new Appwrite.Client().setEndpoint(x.endpoint).setProject(x.project);
        x.tdb=new Appwrite.TablesDB(c);x.storage=new Appwrite.Storage(c);x.acct=new Appwrite.Account(c);x.ok=true;
      }
    }catch(e){console.error("Edu Library: Server "+x.id+" could not start",e);}
  }else{
    x.ok=!!(x.url&&x.key);x.sb=x.ok?supabase.createClient(x.url,x.key):null;
  }
});
function srv(id){return SERVERS.find(x=>x.id===id)||SERVERS[0];}
const sb=SERVERS[0].sb;
/* Appwrite owner sign-in: same email and password as the Supabase owner login */
async function appwriteLogin(email,password){
  const failed=[];
  for(const x of SERVERS){
    if(x.type!=="appwrite"||!x.ok||!x.acct)continue;
    try{
      try{await x.acct.deleteSession({sessionId:"current"});}catch(_){}
      await x.acct.createEmailPasswordSession({email:email,password:password});

function pvLayout(){

}
function pvDropTile(el){
  el._tid=(el._tid||0)+1;
  try{if(el._ttask)el._ttask.cancel();}catch(_){}
  el._ttask=null;
  if(el._tile&&el._tile.parentNode){const c=el._tile;c.width=0;c.height=0;c.remove();}
  el._tile=null;el._tileInfo=null;
}
function pvReset(el){
  el._tk=(el._tk||0)+1;el._busy=false;el._z=null;
  try{if(el._task)el._task.cancel();}catch(_){}
  el._task=null;
  pvDropTile(el);

  if(c){if(c.tagName==="CANVAS"){c.width=0;c.height=0;}el.replaceChildren();}
}
async function pvDraw(el){
  const tk=(el._tk=(el._tk||0)+1);el._busy=true;
  try{
    const pg=await PV.pdf.getPage(+el.dataset.p);
    if(!PV||el._tk!==tk)return;
    const base=pg.getViewport({scale:1});
    el._r=base.height/base.width;
    const z=PV.Z,cssW=Math.round(PV.baseW*z);

    if(px>PV.MAXPX)sc*=Math.sqrt(PV.MAXPX/px);
    const vp=pg.getViewport({scale:sc});
    const cv=document.createElement("canvas");
    cv.width=Math.max(1,Math.floor(vp.width));cv.height=Math.max(1,Math.floor(vp.height));
    cv.style.cssText="display:block;width:100%;height:100%";
    const task=pg.render({canvasContext:cv.getContext("2d"),viewport:vp});
    el._task=task;
    await task.promise;
    if(!PV||el._tk!==tk)return;
    el.style.height=Math.round(cssW*el._r)+"px";
    pvDropTile(el);
    el.replaceChildren(cv);
    el._sc=sc;
    el._z=z;el._task=null;el._busy=false;
    pvSharpSoon();
  }catch(e){
    if(el._tk===tk){el._task=null;el._busy=false;}
  }
}
function pvRefresh(){
  PV.wrap.querySelectorAll(".pvpage").forEach(el=>{
    el._tk=(el._tk||0)+1;el._busy=false;el._z=null;
    try{if(el._task)el._task.cancel();}catch(_){}

}
function pvAnchor(x,y){
  const at=(px,py)=>{const e=document.elementFromPoint(px,py);return e&&e.closest?e.closest(".pvpage"):null;};
  let pg=at(x,y);
  if(!pg){for(const dy of [-14,14,-30,30]){pg=at(x,y+dy);if(pg)break;}}
  if(!pg)return null;
  const r=pg.getBoundingClientRect();
  return {el:pg,fx:(x-r.left)/r.width,fy:(y-r.top)/r.height};
}
function pvSetZoom(z,sx,sy,anchor){

function pvGestures(body,wrap){
  let st=null,pinched=false,tap=null,lastTap=null;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  const mid=t=>[(t[0].clientX+t[1].clientX)/2,(t[0].clientY+t[1].clientY)/2];
  body.addEventListener("touchstart",e=>{
    if(!PV)return;
    if(e.touches.length===2){
      const m=mid(e.touches),w=wrap.getBoundingClientRect();
      st={d0:dist(e.touches)||1,z0:PV.Z,sx:m[0],sy:m[1],s:1,anchor:pvAnchor(m[0],m[1])};

      pinched=true;tap=null;
    }else if(e.touches.length===1&&!st){
      tap={x:e.touches[0].clientX,y:e.touches[0].clientY,moved:false};

  },{passive:false});

      if(PV&&Math.abs(s-1)>0.03)pvSetZoom(z0*s,sx,sy,a);
      setTimeout(()=>{pinched=false;},350);
      return;
    }
    if(e.touches.length===0&&tap&&!tap.moved&&!pinched&&PV){
      const now=Date.now();
      if(lastTap&&now-lastTap.t<320&&Math.abs(tap.x-lastTap.x)<30&&Math.abs(tap.y-lastTap.y)<30){
        pvSetZoom(PV.Z<1.4?2.5:1,tap.x,tap.y);

function pvSharpSoon(){
  if(!PV)return;
  clearTimeout(PV._st);
  PV._st=setTimeout(()=>{
    if(!PV)return;

function pvSharp(){
  if(!PV)return;
  const br=PV.body.getBoundingClientRect();
  PV.wrap.querySelectorAll(".pvpage").forEach(el=>{
    if(!el.firstChild||el._busy||el._z!==PV.Z)return;
    const r=el.getBoundingClientRect();
    if(r.bottom<br.top||r.top>br.bottom||r.right<br.left||r.left>br.right)return;
    pvTile(el,r,br);
  });
}
async function pvTile(el,r,br){
  try{
    if(!el._need||!el._sc||el._sc>=el._need*0.98){pvDropTile(el);return;}
    const vx0=Math.max(0,br.left-r.left),vy0=Math.max(0,br.top-r.top);
    const vx1=Math.min(r.width,br.right-r.left),vy1=Math.min(r.height,br.bottom-r.top);
    const t=el._tileInfo;
    if(t&&t.z===PV.Z&&vx0>=t.x0&&vy0>=t.y0&&vx1<=t.x1&&vy1<=t.y1)return;
    const M=120;
    const x0=Math.floor(Math.max(0,vx0-M)),y0=Math.floor(Math.max(0,vy0-M));
    const x1=Math.ceil(Math.min(r.width,vx1+M)),y1=Math.ceil(Math.min(r.height,vy1+M));
    const w=x1-x0,h=y1-y0;
    if(w<8||h<8)return;
    const myTk=el._tk,myId=(el._tid=(el._tid||0)+1);
    try{if(el._ttask)el._ttask.cancel();}catch(_){}
    const pg=await PV.pdf.getPage(+el.dataset.p);
    if(!PV||el._tk!==myTk||el._tid!==myId)return;
    const base=pg.getViewport({scale:1});
    let d=Math.min(window.devicePixelRatio||1,3);
    if(w*h*d*d>8e6)d=Math.sqrt(8e6/(w*h));
    const sc=(r.width/base.width)*d;
    const vp=pg.getViewport({scale:sc,offsetX:-x0*d,offsetY:-y0*d});
    const cv=document.createElement("canvas");
    cv.width=Math.max(1,Math.round(w*d));cv.height=Math.max(1,Math.round(h*d));
    cv.style.cssText="position:absolute;left:"+x0+"px;top:"+y0+"px;width:"+w+"px;height:"+h+"px;pointer-events:none";
    const task=pg.render({canvasContext:cv.getContext("2d"),viewport:vp});
    el._ttask=task;
    await task.promise;
    if(!PV||el._tk!==myTk||el._tid!==myId)return;
    const old=el._tile;
    el.appendChild(cv);
    if(old&&old.parentNode){old.width=0;old.height=0;old.remove();}
    el._tile=cv;el._tileInfo={z:PV.Z,x0,y0,x1,y1};el._ttask=null;
  }catch(e){}
}

      const r=await x.tdb.listRows({databaseId:x.db,tableId:x.table,queries:[Appwrite.Query.orderDesc("$createdAt"),Appwrite.Query.limit(100),Appwrite.Query.offset(off)]});
      const rows=r.rows||[];
      rows.forEach(w=>out.push({id:w.$id,title:w.title||"",subject:w.subject||"",author:w.author||"",level:w.level||"",class:w.class||"",description:w.description||"",file_path:w.file_path||"",added:w.$createdAt}));
      if(rows.length<100)break;
      off+=100;
    }
    return {data:out,error:null};
  }catch(e){return {data:null,error:e};}
}
function loadServerBooks(x){
  if(x.type==="appwrite")return loadAppwriteBooks(x);
  return x.sb.from("books").select("*").order("added",{ascending:false});
}
async function refreshBooks(){
  const live=SERVERS.filter(x=>x.ok);
  const res=await Promise.allSettled(live.map(x=>loadServerBooks(x)));
  let all=[];const failed=new Set();
  res.forEach((r,i)=>{
    const x=live[i];
    if(r.status==="fulfilled"&&!r.value.error&&r.value.data){r.value.data.forEach(b=>{b._s=x.id;all.push(b);});}
    else{failed.add(x.id);console.error("Edu Library: failed to load books from "+x.name,r.status==="fulfilled"?r.value.error:r.reason);}
  });
  if(failed.size<live.length){
    all=all.concat(booksCache.filter(b=>failed.has(b._s)));
    all.sort((a,b)=>{const p=String(a.added||""),q=String(b.added||"");return p<q?1:(p>q?-1:0);});
    booksCache=all;
  }
  return booksCache;
}

    e.preventDefault();
    const f = e.target, msg = document.getElementById("loginMsg"), btn = f.querySelector("button");
    if(!sb){ msg.textContent = "Server not connected."; return; }
    btn.disabled = true; msg.textContent = "Signing in...";
    try{

      if(error) throw error;
      sessionStorage.setItem("edu_admin","1");
      const bad = await appwriteLogin(f.user.value.trim(), f.pass.value);

        msg.textContent = bad.join(", ")+" login failed, so uploads there will not work. Opening the panel...";
        await new Promise(r=>setTimeout(r,2500));
      }
      location.hash = "#/admin/panel";

    }finally{ btn.disabled = false; }
  };
}

async function saveExam(){
  const g=id=>document.getElementById(id);
  const title=g("x_title").value.trim(), subject=g("x_subject").value.trim(), level=g("x_level").value, cls0=g("x_class").value;
  const body=EXAM_BODIES[cls0]?g("x_body").value:"", desc=g("x_desc").value.trim(), fileInput=g("x_file"), msg=g("examMsg"), btn=g("saveExamBtn");
  if(!title||!subject||!fileInput.files[0]){ msg.style.color="#B3261E"; msg.textContent="Enter the exam title, the subject and choose a PDF file."; return; }
  const file=fileInput.files[0];
  if(file.type!=="application/pdf"){ msg.style.color="#B3261E"; msg.textContent="Please choose a PDF file."; return; }
  const S=srv((g("x_server")||{}).value||"C");
  if(!S.exam||!S.ok){ msg.style.color="#B3261E"; msg.textContent=(S.exam?S.name:"An examination server")+" is not connected yet."; return; }
  const cls=cls0+TIER_SEP+"Exam"+(body?TIER_SEP+body:"");
  const path=`${level}/${cls0}/Exam${body?"/"+body:""}/${Date.now()}_${file.name}`.replace(/\s+/g,"_");
  btn.disabled=true; msg.style.color="var(--sub)"; msg.textContent="Uploading PDF exam...";
  try{
    if(S.type==="appwrite"){
      const up=await S.storage.createFile({bucketId:S.bucket,fileId:Appwrite.ID.unique(),file:file});
      const fileUrl=S.endpoint+"/storage/buckets/"+S.bucket+"/files/"+up.$id+"/view?project="+S.project;
      await S.tdb.createRow({databaseId:S.db,tableId:S.table,rowId:Appwrite.ID.unique(),data:{title:title,subject:subject,author:"",level:level,class:cls,description:desc,file_path:fileUrl}});
    }else{
      const {error:upErr}=await S.sb.storage.from("books").upload(path,file);
      if(upErr) throw upErr;
      const {data:pub}=S.sb.storage.from("books").getPublicUrl(path);
      const {error:dbErr}=await S.sb.from("books").insert({title,subject,author:"",level,class:cls,description:desc,file_path:pub.publicUrl});
      if(dbErr) throw dbErr;
    }
    await refreshBooks();
    msg.style.color="var(--primary)";
    msg.textContent=`Saved: ${subject} → Examinations → ${level} → ${cls0}${body?" → "+body:""}.`;
    ["x_title","x_subject","x_desc"].forEach(id=>g(id).value=""); fileInput.value="";
  }catch(e){
    msg.style.color="#B3261E"; msg.textContent="Upload failed: "+(e.message||"please try again.");
  }finally{ btn.disabled=false; }
}

async function saveBook(){

  const btn = document.getElementById("saveBookBtn");

  if(fileInput.files[0].type !== "application/pdf"){ msg.style.color = "#B3261E"; msg.textContent = "Please choose a PDF file."; return; }

  const S=srv((document.getElementById("f_server")||{}).value||"A");
  if(!S.ok){ msg.style.color = "#B3261E"; msg.textContent = S.name+" is not connected yet."; return; }
  const file = fileInput.files[0];
  const path = `${level}/${cls0}${isEx?"/Exam":(tier?"/"+tier:"")}/${Date.now()}_${file.name}`.replace(/\s+/g,"_");
  btn.disabled = true;
  msg.style.color = "var(--sub)";
  msg.textContent = "Uploading PDF...";
  try{
    if(S.type==="appwrite"){
      const up = await S.storage.createFile({bucketId:S.bucket,fileId:Appwrite.ID.unique(),file:file});
      const fileUrl = S.endpoint+"/storage/buckets/"+S.bucket+"/files/"+up.$id+"/view?project="+S.project;
      await S.tdb.createRow({databaseId:S.db,tableId:S.table,rowId:Appwrite.ID.unique(),data:{title:title||"",subject:subject||"",author:author||"",level:level||"",class:cls||"",description:desc||"",file_path:fileUrl}});
    }else{
      const { error: upErr } = await S.sb.storage.from("books").upload(path, file);
      if(upErr) throw upErr;
      const { data: pub } = S.sb.storage.from("books").getPublicUrl(path);
      const { error: dbErr } = await S.sb.from("books").insert({
        title, subject, author, level, class: cls, description: desc, file_path: pub.publicUrl
      });
      if(dbErr) throw dbErr;
    }
    await refreshBooks();
    msg.style.color = "var(--primary)";
    msg.textContent = `Saved to ${isEx?"Examinations → ":""}${level} → ${cls0}${tier?" → "+tier:""}.`;
    ["f_title","f_subject","f_author","f_desc"].forEach(id=>document.getElementById(id).value="");
    fileInput.value = "";
  } catch(e){
    msg.style.color = "#B3261E";
    msg.textContent = "Upload failed: " + (e.message || "please try again.");
  } finally {
    btn.disabled = false;
    renderAdminPanel(document.getElementById("app"));
  }
}

function fmtInline(t){
  return esc(t)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/__([^_]+)__/g,"<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g,"$1<i>$2</i>")
    .replace(/\*{1,}|#{2,}|~~/g,"");
}
function fmtAI(text){
  const lines=String(text||"").replace(/\r/g,"").split("\n");
  let out="",list=null;
  const close=()=>{if(list){out+="</"+list+">";list=null;}};
  for(let raw of lines){
    const line=raw.trim();
    if(!line){close();continue;}
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(line)){close();continue;}
    let m;
    if((m=line.match(/^#{1,6}\s*(.+)$/))){close();out+="<h4>"+fmtInline(m[1].replace(/#+\s*$/,""))+"</h4>";}
    else if((m=line.match(/^[-*•+]\s+(.+)$/))){if(list!=="ul"){close();out+="<ul>";list="ul";}out+="<li>"+fmtInline(m[1])+"</li>";}
    else if((m=line.match(/^\d+[.)]\s+(.+)$/))){if(list!=="ol"){close();out+="<ol>";list="ol";}out+="<li>"+fmtInline(m[1])+"</li>";}
    else{close();out+="<p>"+fmtInline(line)+"</p>";}
  }
  close();return out;
}
function plainAI(text){
  return String(text||"").replace(/```/g,"").replace(/^#{1,6}\s*/gm,"").replace(/^\s*[-*•+]\s+/gm,"").replace(/[*_`#~@\\|]/g," ").replace(/\s{2,}/g," ").trim();
}

}

/* ---- Chichewa reading: detect it, pick the closest voice, and make the spelling easier to pronounce ---- */
const NY_WORDS=new Set("ndi ndipo koma kuti chifukwa mukhoza tingathe bwanji moni zikomo komanso chonde phunzira sukulu mwana ana nthawi kapena ngati amene izi izo ichi lero mawa dzulo pamene ndiye mphunzitsi wophunzira buku mabuku kuwerenga kulemba chomera madzi dzuwa mpweya thupi ntchito ndine iwe iye inu ife ali muli mwa zake mumatha timatha amatha anthu munthu zonse zina zambiri pang'ono chabwino pepani tsiku mlungu mwezi chaka akuti umenewu yanu wanu lanu zanu mukuti kwambiri bwino ayi inde".split(" "));
function isChichewa(t){
  const w=String(t||"").toLowerCase().replace(/[^a-z'\s]/g," ").split(/\s+/).filter(x=>x.length>=3);
  if(w.length<3)return false;
  let c=0;w.forEach(x=>{if(NY_WORDS.has(x))c++;});
  return c>=2&&c/w.length>=0.1;
}
function nyClean(t){
  return String(t||"")
    .replace(/ng[’']/gi,"ng").replace(/[’']/g,"")
    .replace(/ph/gi,"p").replace(/th/gi,"t").replace(/kh/gi,"k")
    .replace(/\s{2,}/g," ");
}
function getNyChoice(){try{return localStorage.getItem("edu_ai_voice_ny")||"";}catch(e){return "";}}
function setNyChoice(v){try{if(v)localStorage.setItem("edu_ai_voice_ny",v);else localStorage.removeItem("edu_ai_voice_ny");}catch(e){}}
/* closest voices for Chichewa, best first: real Chichewa, then Swahili (same clear vowels), then Spanish/Italian/Portuguese */
function nyCandidates(){
  const order=["ny","sw","it","es","pt"];
  const out=[];
  order.forEach(pre=>cachedVoices.filter(v=>(v.lang||"").toLowerCase().replace("_","-").split("-")[0]===pre).sort((a,b)=>voiceScore(b)-voiceScore(a)).forEach(v=>out.push(v)));
  return out;
}
/* male / female choice: one setting used for BOTH English and Chichewa ("" = automatic) */
function getGender(){try{const g=localStorage.getItem("edu_ai_gender");return g==="F"||g==="M"?g:"";}catch(e){return "";}}
function setGender(g){try{if(g)localStorage.setItem("edu_ai_gender",g);else localStorage.removeItem("edu_ai_gender");}catch(e){}}
/* best voices first, but voices of the wanted gender come before unknown ones, then the opposite gender */
function orderForGender(list,g){
  if(!g)return list;
  return list.filter(v=>voiceGender(v)===g).concat(list.filter(v=>voiceGender(v)==="?"),list.filter(v=>voiceGender(v)!=="?"&&voiceGender(v)!==g));
}
/* on automatic, Chichewa follows the gender of the English voice so the two always match */
function wantedGender(){
  const g=getGender();if(g)return g;
  const e=pickCalmVoice(),eg=e?voiceGender(e):"?";
  return eg==="?"?"":eg;
}
/* if the phone has no voice of the wanted gender, lower or raise the pitch so it still sounds male or female */
function genderPitch(v,g){
  if(!g)return 1;
  if(!v)return g==="M"?0.78:1;
  const vg=voiceGender(v);
  if(vg===g||vg==="?")return 1;
  return g==="M"?0.75:1.3;
}
function ttsPitch(v,ny){
  const p=V_STYLES[getVStyle()].p*genderPitch(v,ny?wantedGender():getGender());
  return Math.min(2,Math.max(0.1,p));
}
function pickNyVoice(){
  const c=getNyChoice(),g=getGender();
  if(c){const v=cachedVoices.find(v=>voiceKey(v)===c);if(v&&(!g||voiceGender(v)===g||voiceGender(v)==="?"))return v;}
  return orderForGender(nyCandidates(),wantedGender())[0]||null;
}

/* voice gender is guessed from the voice's name; age is a style (pitch + speed) applied on top of any voice */
const V_FEM=/female|woman|zira|samantha|karen|aria|jenny|libby|sonia|susan|hazel|serena|moira|tessa|fiona|victoria|allison|ava|emma|amy|joanna|salli|kimberly|kendra|ivy|nicole|olivia|natasha|michelle|clara|heather|catherine|linda|hedda|paulina|monica|elsa|isabella|sara|sarah|laura|lucia|helena|maria|kiswahili/i;
const V_MAL=/\bmale\b|\bman\b|david|mark|daniel|alex|fred|george|guy|ryan|ethan|brian|james|liam|davis|christopher|eric|roger|steffan|rishi|thomas|oliver|arthur|aaron|gordon|rocko|tom|jorge|diego|carlos|pablo|luca|mattias|richard|stefan|william|henry/i;
function voiceGender(v){
  const n=(v.name||"")+" "+(v.voiceURI||"");
  if(/female|woman/i.test(n))return "F";
  if(/\bmale\b|\bman\b/i.test(n))return "M";
  if(V_FEM.test(n))return "F";
  if(V_MAL.test(n))return "M";
  return "?";
}
const V_STYLES={child:{l:"👧 Child",p:1.55,r:1.08},young:{l:"🧑 Young",p:1.2,r:1.03},adult:{l:"🧔 Adult",p:1,r:1},mature:{l:"👴 Mature",p:0.82,r:0.94}};
function getVStyle(){try{const k=localStorage.getItem("edu_ai_vstyle");return V_STYLES[k]?k:"adult";}catch(e){return "adult";}}
function setVStyle(k){try{localStorage.setItem("edu_ai_vstyle",k);}catch(e){}}
function voiceScore(v){
  const n=(v.name||"")+" "+(v.voiceURI||""),l=(v.lang||"").toLowerCase();
  let sc=0;
  if(/natural|neural|wavenet|studio|premium|enhanced|online|siri/i.test(n))sc+=6;
  if(v.localService===false)sc+=3;
  if(/google/i.test(n))sc+=2;
  if(/-x-.*-local|espeak|compact/i.test(n))sc-=4;
  if(/^en[-_](gb|za|us|au|ie)/.test(l))sc+=1;
  if(l.startsWith("en-gb"))sc+=1;
  if(/female|samantha|karen|zira|aria|jenny|libby|sonia|serena|susan/i.test(n))sc+=1;
  return sc;
}
function voiceIsNatural(v){return voiceScore(v)>=5;}
function pickCalmVoice(){
  if(!cachedVoices.length) return null;
  const chosen=getVoiceChoice(),g=getGender();
  if(chosen){const c=cachedVoices.find(v=>voiceKey(v)===chosen);if(c&&(!g||voiceGender(c)===g||voiceGender(c)==="?"))return c;}
  const en=cachedVoices.filter(v=>/^en/i.test(v.lang||""));
  const pool=(en.length?en:cachedVoices).slice().sort((a,b)=>voiceScore(b)-voiceScore(a));
  return orderForGender(pool,g)[0]||null;
}

  const o=document.createElement("div");o.className="aimodal";

  const label=v=>String(v.name||"Voice").replace(/^(Microsoft|Google)\s+/i,"").replace(/\s*-\s*.*$/,"").trim()||"Voice";
  const gtag=v=>({F:"Female",M:"Male","?":"Voice"}[voiceGender(v)]);

  function say(ny){
    ttsStop();
    const u=new SpeechSynthesisUtterance(ny?nyClean("Moni! Ndine Edu AI, mphunzitsi wanu wa pa sukulu."):"Hello! I am Edu AI, your study assistant.");
    const st=V_STYLES[getVStyle()];u.rate=(ny?0.88:0.96)*st.r;u.pitch=st.p;
    const v=ny?pickNyVoice():pickCalmVoice();if(v){u.voice=v;u.lang=v.lang||u.lang;}else if(ny)u.lang="sw-KE";u.pitch=ttsPitch(v,ny);
    try{speechSynthesis.speak(u);}catch(_){}
  }
  function draw(){

    const rest=cachedVoices.filter(v=>!/^en/i.test(v.lang||"")).sort(byScore);
    const base=showAll?en.concat(rest):(en.length?en:cachedVoices);
    const shown=base.filter(okG);
    const nF=base.filter(v=>voiceGender(v)==="F").length,nM=base.filter(v=>voiceGender(v)==="M").length;
    let h='<div class="avh2">Voice type</div><div class="avtabs" id="avG">'+

    h+='<div class="avh2">Voice age</div><div class="avtabs" id="avS">'+Object.keys(V_STYLES).map(k=>`<button type="button" data-s="${k}" class="${vs===k?"sel":""}">${V_STYLES[k].l.replace(/^\S+\s/,m=>m)}</button>`).join("")+'</div>';
    h+='<p class="hint" style="margin:0 0 10px">Age changes how high or deep the voice sounds and how fast it speaks. Male or Female is used for both English and Chichewa. Some phones do not say if a voice is male or female, so tap to listen. If the phone has no voice of that type, Edu AI makes the closest one sound deeper or higher.</p>';
    h+=row("","en",!cur,"<b>Automatic</b>","Picks the most natural voice on your phone");
    if(!cachedVoices.length)h+='<p class="hint" style="margin:10px 0">Loading voices… if none appear, your phone has no voices installed.</p>';
    else if(!shown.length)h+='<p class="hint" style="margin:10px 0">No '+(gf==="F"?"female":"male")+' voice is marked on this phone, so Edu AI will use the closest voice and make it sound '+(gf==="F"?"higher":"deeper")+'.</p>';
    shown.forEach(v=>{const k=voiceKey(v);h+=row(k,"en",cur===k,esc(label(v))+(voiceIsNatural(v)?" ✨":""),esc(gtag(v))+" · "+esc(v.lang||"")+(v.localService===false?" · online":"")+(voiceIsNatural(v)?" · sounds most human":""));});
    const nyAll=nyCandidates(),ny=nyAll.filter(v=>gf==="all"||voiceGender(v)===gf||voiceGender(v)==="?");
    h+='<h4 class="avh">🇲🇼 Voice for Chichewa</h4><p class="hint" style="margin:0 0 8px">Used when Edu AI reads an answer written in Chichewa. Chichewa has very few phone voices, so the closest clear voice is used.</p>';
    h+=row("","ny",!curNy,"<b>Automatic</b>",ny.length?(gf==="all"?"Best match on your phone":"Closest "+(gf==="F"?"female":"male")+" voice on your phone"):(nyAll.length?"Closest voice, tone changed to sound "+(gf==="F"?"female":"male"):"No close voice found — the normal voice will be used"));
    ny.forEach(v=>{const k=voiceKey(v);const l=(v.lang||"").toLowerCase();const tag=l.startsWith("ny")?"Chichewa":(l.startsWith("sw")?"Swahili · closest sound":"Similar sound");h+=row(k,"ny",curNy===k,esc(label(v)),esc(gtag(v))+" · "+esc(v.lang||"")+" · "+tag);});
    list.innerHTML=h;
    more.style.display=(en.length&&rest.length)?"":"none";
    more.textContent=showAll?"Show English voices only":"Show voices in other languages";
    const sc=list.scrollTop;
    list.querySelectorAll("#avG button").forEach(b=>b.onclick=()=>{
      const g=b.dataset.g==="all"?"":b.dataset.g;setGender(g);
      if(g){[[getVoiceChoice,setVoiceChoice],[getNyChoice,setNyChoice]].forEach(pr=>{const k=pr[0](),vv=k&&cachedVoices.find(x=>voiceKey(x)===k);if(vv&&voiceGender(vv)!=="?"&&voiceGender(vv)!==g)pr[1]("");});}
      const t=list.scrollTop;draw();list.scrollTop=t;say(false);

    list.querySelectorAll("#avS button").forEach(b=>b.onclick=()=>{setVStyle(b.dataset.s);draw();say(false);});
    list.querySelectorAll(".avrow").forEach(b=>b.onclick=()=>{

      const t=list.scrollTop;draw();list.scrollTop=t;say(ny);
    });
    list.scrollTop=sc;
  }
  more.onclick=()=>{showAll=!showAll;draw();};
  draw();
  speechSynthesis.onvoiceschanged=()=>{loadVoices();if(document.body.contains(o))draw();};
}
let TTS={i:-1,chunks:[],pos:0,state:"idle",tok:0,u:null},TTS_AUD=null;
const TTS_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const TTS_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
function ttsOn(i){return TTS.i===i&&TTS.state==="playing";}
function ttsIcon(i){return ttsOn(i)?TTS_PAUSE:TTS_PLAY;}
function ttsSplit(t){
  const parts=String(t||"").match(/[^.!?;:\n]+[.!?;:]*\s*/g)||[];
  const out=[];let cur="";
  for(const p of parts){if(cur&&(cur+p).length>180){out.push(cur.trim());cur=p;}else cur+=p;}
  if(cur.trim())out.push(cur.trim());
  return out;
}
function ttsSilence(){
  const n=8000,b=new Uint8Array(44+n),d=new DataView(b.buffer);
  const w=(o,x)=>{for(let k=0;k<x.length;k++)d.setUint8(o+k,x.charCodeAt(k));};
  w(0,"RIFF");d.setUint32(4,36+n,true);w(8,"WAVE");w(12,"fmt ");d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);
  d.setUint32(24,8000,true);d.setUint32(28,8000,true);d.setUint16(32,1,true);d.setUint16(34,8,true);w(36,"data");d.setUint32(40,n,true);
  b.fill(128,44);
  return URL.createObjectURL(new Blob([b],{type:"audio/wav"}));
}
/* keeps the page alive in the background and shows play/pause in the phone's media controls */
function ttsBg(on){
  try{
    if(on){
      if(!TTS_AUD){TTS_AUD=new Audio(ttsSilence());TTS_AUD.loop=true;TTS_AUD.volume=.05;}
      const p=TTS_AUD.play();if(p&&p.catch)p.catch(()=>{});
      if("mediaSession" in navigator){
        navigator.mediaSession.metadata=new MediaMetadata({title:"Edu AI",artist:"Edu Library"});
        navigator.mediaSession.setActionHandler("play",()=>{if(TTS.state==="paused")ttsResume();});
        navigator.mediaSession.setActionHandler("pause",()=>{if(TTS.state==="playing")ttsPause();});
        navigator.mediaSession.setActionHandler("stop",()=>ttsStop());
      }
    }else{
      if(TTS_AUD)TTS_AUD.pause();
      if("mediaSession" in navigator){
        navigator.mediaSession.metadata=null;
        ["play","pause","stop"].forEach(a=>{try{navigator.mediaSession.setActionHandler(a,null);}catch(_){}});
      }
    }
  }catch(_){}
}
function ttsUI(){
  document.querySelectorAll(".speak-btn").forEach(b=>{
    const i=+b.dataset.i,on=ttsOn(i),t=on?"Pause":"Play";
    b.classList.toggle("on",on);b.innerHTML=ttsIcon(i);b.title=t;b.setAttribute("aria-label",t);
  });
  if("mediaSession" in navigator){try{navigator.mediaSession.playbackState=TTS.state==="playing"?"playing":(TTS.state==="paused"?"paused":"none");}catch(_){}}
}
function ttsNext(){
  if(TTS.state!=="playing")return;
  if(TTS.pos>=TTS.chunks.length){ttsEnd();return;}
  const my=++TTS.tok;
  const ny=!!TTS.ny;
  const u=new SpeechSynthesisUtterance(ny?nyClean(TTS.chunks[TTS.pos]):TTS.chunks[TTS.pos]);
  {const st=V_STYLES[getVStyle()];u.rate=(ny?0.88:0.96)*st.r;u.pitch=st.p;u.volume=1;}
  const v=ny?pickNyVoice():pickCalmVoice();
  if(v){u.voice=v;u.lang=v.lang||u.lang;}else if(ny){u.lang="sw-KE";}
  u.pitch=ttsPitch(v,ny);
  u.onend=()=>{if(TTS.tok!==my||TTS.state!=="playing")return;TTS.pos++;ttsNext();};
  u.onerror=e=>{if(TTS.tok!==my||TTS.state!=="playing")return;if(e&&(e.error==="interrupted"||e.error==="canceled"))return;TTS.pos++;ttsNext();};
  TTS.u=u;
  speechSynthesis.speak(u);
}
function ttsEnd(){TTS.state="idle";TTS.i=-1;TTS.chunks=[];TTS.pos=0;ttsBg(false);ttsUI();}
function ttsStop(silent){
  TTS.tok++;
  try{if("speechSynthesis" in window)speechSynthesis.cancel();}catch(_){}
  TTS.state="idle";TTS.i=-1;TTS.chunks=[];TTS.pos=0;
  ttsBg(false);
  if(!silent)ttsUI();
}
function ttsPause(){TTS.state="paused";TTS.tok++;try{speechSynthesis.cancel();}catch(_){}ttsUI();}
function ttsResume(){TTS.state="playing";ttsUI();ttsNext();}
function speakMsg(i){
  if(!("speechSynthesis" in window)||!chatTurns[i])return;
  if(TTS.i===i&&TTS.state==="playing"){ttsPause();return;}
  if(TTS.i===i&&TTS.state==="paused"){ttsResume();return;}
  ttsStop(true);
  TTS.i=i;TTS.ny=isChichewa(chatTurns[i].content);TTS.chunks=ttsSplit(plainAI(chatTurns[i].content));TTS.pos=0;TTS.state="playing";
  ttsBg(true);ttsUI();ttsNext();
}
